name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  verify:
    name: Typecheck, Lint, Purity, Tests & Milestone Gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mirrorgrid
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mirrorgrid
      GATEWAY_PORT: 4000
      CONTROL_PORT: 4001
      SIMULATION_PORT: 4002
      WEB_PORT: 3000
      SESSION_SECRET: ci_session_secret_32_characters_minimum_length_required

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck Monorepo
        run: npm run typecheck

      - name: Lint & Purity Rules
        run: npm run lint

      - name: Dependency Cruiser Architectural Boundaries
        run: npm run dep-cruiser

      - name: Unit Tests
        run: npm run test

      - name: Database Migrations
        run: npm run db:migrate

      - name: Verify Gate M0 (Foundation & Walking Skeleton)
        run: npm run verify:m0

      - name: Verify Gate M1 (Domain Model & Topology Engine)
        run: npm run verify:m1

      - name: Verify Gate M2 (Deterministic Logical Runtime)
        run: npm run verify:determinism

      - name: Assert No-Mock-Data Rule
        run: |
          if find . -maxdepth 4 -name "mock-data.ts" -o -name "*.mock.ts" | grep -q .; then
            echo "FAILED: mock-data.ts or *.mock.ts files detected in repository!"
            exit 1
          fi
          echo "PASSED: Zero mock files in repository."
