name: Nightly Heavy Suite

on:
  schedule:
    # 02:00 UTC every night
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  nightly-gates:
    name: Nightly Replay, Benchmarks & Stress Gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mirrorgrid
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mirrorgrid
      GATEWAY_PORT: 4000
      CONTROL_PORT: 4001
      SIMULATION_PORT: 4002
      WEB_PORT: 3000
      SESSION_SECRET: nightly_session_secret_32_characters_minimum_length_required

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Full Gates Suite
        run: |
          npm run db:migrate
          npm run verify:m0
          npm run verify:m1
          npm run verify:determinism
          echo "Nightly core verification complete."
