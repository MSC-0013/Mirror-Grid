name: mirrorgrid

networks:
  mirrorgrid-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:

services:
  # =========================================================================
  # Profile: core (Active for M0, M1, M2, M4, M5)
  # =========================================================================
  postgres:
    image: postgres:18.6-alpine
    container_name: mirrorgrid-postgres
    profiles:
      - core
      - full
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mirrorgrid
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mirrorgrid"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
    networks:
      - mirrorgrid-net

  # =========================================================================
  # Profile: cache (M6+)
  # =========================================================================
  redis:
    image: redis:7.4.2-alpine
    container_name: mirrorgrid-redis
    profiles:
      - cache
      - full
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5
    networks:
      - mirrorgrid-net

  # =========================================================================
  # Profile: runtime (M3+) - Network Chaos Proxy
  # =========================================================================
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.11.0
    container_name: mirrorgrid-toxiproxy
    profiles:
      - runtime
      - full
    ports:
      - "8474:8474" # API
      - "20000-20050:20000-20050" # Proxy edge ports
    networks:
      - mirrorgrid-net

  # =========================================================================
  # Profile: events (M8+) - Kafka KRaft Single Broker (No ZooKeeper)
  # =========================================================================
  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: mirrorgrid-kafka
    profiles:
      - events
      - full
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - mirrorgrid-net

  # =========================================================================
  # Profile: obs (M9+) - Observability
  # =========================================================================
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: mirrorgrid-prometheus
    profiles:
      - obs
      - full
    ports:
      - "9090:9090"
    networks:
      - mirrorgrid-net

  jaeger:
    image: jaegertracing/all-in-one:1.66.0
    container_name: mirrorgrid-jaeger
    profiles:
      - obs
      - full
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks:
      - mirrorgrid-net
